<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiYuan-AI-Expand 同步控制台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>SiYuan-AI-Expand 同步控制台</h1>
    <span id="syncBadge" class="badge badge-idle">空闲</span>
  </header>

  <main id="app">
    <!-- 思源连接 -->
    <section class="card">
      <h2>思源连接</h2>
      <div class="grid">
        <label>Server URL
          <input id="fServerUrl" type="text" placeholder="http://127.0.0.1:6806" autocomplete="off">
        </label>
        <label>Token
          <input id="fToken" type="password" placeholder="未设置留空；已设置显示 ********" autocomplete="off">
        </label>
        <label>默认笔记本
          <input id="fDefaultNotebook" type="text" placeholder="默认笔记本名" autocomplete="off">
        </label>
      </div>
      <div class="actions">
        <button id="btnSaveConfig" type="button">保存配置</button>
        <button id="btnTestSiyuan" type="button" class="secondary">测试连接</button>
      </div>
      <p id="siyuanTestResult" class="muted" aria-live="polite"></p>
    </section>

    <!-- 同步设置 -->
    <section class="card">
      <h2>同步设置</h2>
      <div class="grid">
        <label>间隔（分钟）
          <input id="fInterval" type="number" min="1" step="1">
        </label>
        <label class="checkbox">
          <input id="fRunOnStart" type="checkbox">
          启动时立即跑一轮
        </label>
      </div>
    </section>

    <!-- 项目列表 -->
    <section class="card">
      <h2>项目列表</h2>
      <div class="actions">
        <button id="btnAddProject" type="button">新增项目</button>
        <button id="btnReloadProjects" type="button" class="secondary">刷新</button>
      </div>
      <table id="projectsTable" class="data">
        <thead>
          <tr>
            <th>名称</th><th>启用</th><th>docPath</th><th>笔记本</th><th>父路径</th><th colspan="3">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 立即同步 / 状态 -->
    <section class="card">
      <h2>立即同步 / 状态</h2>
      <div class="actions">
        <button id="btnRunSync" type="button">立即全部同步</button>
        <button id="btnRefreshStatus" type="button" class="secondary">刷新状态</button>
      </div>
      <p id="syncRunResult" class="muted" aria-live="polite"></p>
      <table id="statusTable" class="data">
        <thead>
          <tr>
            <th>项目</th><th>开始</th><th>成功</th><th>跳过</th><th>失败</th><th>状态</th><th>错误</th><th>明细</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="statusEmpty" class="muted">暂无同步记录</p>
    </section>

    <!-- 项目编辑弹窗 -->
    <dialog id="projectDialog">
      <form method="dialog" id="projectForm">
        <h3 id="projectDialogTitle">新增项目</h3>
        <label>名称<input id="pName" type="text" required></label>
        <label>docPath（绝对或相对路径）<input id="pDocPath" type="text" required></label>
        <label>笔记本（留空走默认）<input id="pNotebook" type="text"></label>
        <label>父路径（如 /JPT）<input id="pParentPath" type="text"></label>
        <label class="checkbox"><input id="pEnabled" type="checkbox" checked>启用</label>
        <div class="actions">
          <button type="button" id="pCancel">取消</button>
          <button type="button" id="pSave">保存</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="/app.js"></script>
</body>
</html>
