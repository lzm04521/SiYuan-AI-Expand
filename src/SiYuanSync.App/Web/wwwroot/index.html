<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiYuan-AI-Expand 同步控制台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div class="banner">
    <div class="logo">S</div>
    <div class="app-title">SiYuan-AI-Expand 同步控制台</div>
    <div class="banner-status">
      <span :class="['badge', 'badge-sync', running ? 'run' : '']">{{ running ? '运行中' : '空闲' }}</span>
      <span>运行 <b class="mono">{{ uptimeText }}</b></span>
      <span>内存 <b class="mono">{{ fmtBytes(info.workingSetBytes) }}</b></span>
      <span>版本 <b class="mono">{{ info.version || '…' }}</b></span>
    </div>
  </div>
  <div class="layout">
    <aside class="side">
      <a v-for="t in tabs" :key="t.id" :class="{active: tab===t.id}" @click="tab=t.id">{{ t.name }}</a>
    </aside>
    <main>
      <overview-page v-if="tab==='overview'" :info="info" @running="onRunning" @idle="running=false"></overview-page>
      <projects-page v-if="tab==='projects'"></projects-page>
      <logs-page v-if="tab==='logs'"></logs-page>
      <settings-page v-if="tab==='settings'"></settings-page>
      <about-page v-if="tab==='about'"></about-page>
    </main>
  </div>
</div>
<script src="/vendor/vue.global.prod.js"></script>
<script src="/app.js"></script>
</body>
</html>
