name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z，留空则从 Directory.Build.props 读取）'
        required: false
        default: ''

permissions:
  contents: write   # softprops/action-gh-release 创建 Release / tag / 上传资产需要

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # tag 触发：用 tag 去掉前导 v；手动触发：优先输入，其次读 Directory.Build.props
          $tag = '${{ github.ref_name }}'
          if ($tag -like 'v*') {
            $ver = $tag -replace '^v', ''
          } elseif ('${{ inputs.version }}' -ne '') {
            $ver = '${{ inputs.version }}' -replace '^v', ''
          } else {
            $xml = [xml](Get-Content -Raw Directory.Build.props)
            $ver = $xml.Project.PropertyGroup.Version.Trim()
          }
          Write-Host "version=$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish (build + zip)
        shell: pwsh
        run: ./publish.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            # SiYuan-AI-Expand v${{ steps.ver.outputs.version }}

            Windows 平台（win-x64，自包含，无需安装 .NET 运行时）。

            ## 安装
            1. 下载并解压 `SiYuan-AI-Expand-${{ steps.ver.outputs.version }}-win-x64.zip`
            2. 双击 `SiYuan-AI-Expand.exe`，系统托盘出现图标
            3. 双击托盘图标打开管理页（http://127.0.0.1:61122）完成首次配置

            ## 升级
            已安装旧版本：管理页 → 系统 Tab → 检查更新，程序自动下载升级包并重启。
          files: |
            publish/SiYuan-AI-Expand.exe
            publish/SiYuan-AI-Expand-Updater.exe
            publish/SiYuan-AI-Expand-${{ steps.ver.outputs.version }}-win-x64.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SiYuan-AI-Expand-${{ steps.ver.outputs.version }}-win-x64
          path: publish/
